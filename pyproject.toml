[project]
name = "preview-diagnostic-tool"
version = "0.1.0"
description = "Backend FastAPI para generar propuestas preliminares de automatizacion con un agente LangGraph."
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115.12",
  "uvicorn[standard]>=0.34.2",
  "pydantic>=2.11.4",
  "pydantic-settings>=2.9.1",
  "langgraph>=0.4.5",
  "langchain-core>=0.3.60",
  "langchain-openai>=0.3.17",
  "langchain-groq>=0.3.2"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.3.5",
  "ruff>=0.11.10"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
